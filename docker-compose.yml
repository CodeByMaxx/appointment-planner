services:
  postgres:
    image: postgres:16
    container_name: appointment-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: appointment-planner-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      AWS_REGION: "${AWS_REGION}"
      SES_FROM_EMAIL: "${SES_FROM_EMAIL}"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${API_BASE_URL}"
        VITE_ADMIN_PASSWORD: "${VITE_ADMIN_PASSWORD}"
    container_name: appointment-planner-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
